<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kauppalista mukana kun laput hukassa</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script> 
</head>
<body>

    <h1>Kauppalista mukana kun laput hukassa</h1>
    <p> Mitä pitää ostaa kaupasta?</p>
    <form id="Ostoslista">
         <label for="tuote">Tuotteen nimi:</label>
         <input type="text" id="tuote" placeholder="Esimerkiksi kahvi">
         <button type="submit">Lisää tuote</button>
    </form>

    <p id="virhe"></p>

    <h2>Ostettavat tuotteet</h2>
    <ul id="ostoslista"></ul>

    <h2>Ostetut tuotteet </h2>
    <ul id="ostetutTuotteet"></ul>

</body>
</html>
